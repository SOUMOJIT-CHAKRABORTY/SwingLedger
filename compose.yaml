services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: swingledger
      POSTGRES_USER: swingledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - swingledger-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingledger -d swingledger"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  swingledger-db:
